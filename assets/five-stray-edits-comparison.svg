<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="512" viewBox="0 0 1160 512" role="img" aria-label="Comparison of 5 AI stray edit failure modes plus honest business-logic boundary across guardrails">
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16.5px; font-weight: 700; fill: #0f172a; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #475569; }
    .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
    .td { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #1e293b; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #475569; }
    .pass { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #15803d; }
    .miss { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #b91c1c; }
    .warn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #b45309; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.5px; fill: #64748b; }
  </style>

  <rect width="1160" height="512" rx="12" class="bg" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="28" y="34" class="title">What AI Coding Guardrails Actually Catch — and Where Every AST Guard Stops</text>
  <text x="28" y="54" class="sub">Locally reproduced on macOS (Node 24.19.0 / Python 3.12): Northstar @ 44b91b91, module-gates v1.1.4 @ fa520c54, NoStray v0.1.0</text>

  <!-- Table Header -->
  <rect x="24" y="68" width="1112" height="38" rx="6" fill="#f1f5f9"/>
  <rect x="970" y="68" width="166" height="38" rx="6" fill="#ecfdf5"/>
  <text x="40"  y="92" class="th">Real Failure Scenario</text>
  <text x="416" y="92" class="th">Path-Only Sandbox</text>
  <text x="604" y="92" class="th">module-gates 1.1.4</text>
  <text x="798" y="92" class="th">Northstar (default)</text>
  <text x="982" y="92" class="th" fill="#065f46">NoStray v0.1</text>

  <!-- Row 1 -->
  <line x1="24" y1="158" x2="1136" y2="158" stroke="#e2e8f0"/>
  <text x="40"  y="128" class="td" font-weight="600">1. Silent sibling export deletion</text>
  <text x="40"  y="146" class="code">Deletes export calcTax() inside allowed file</text>
  <text x="416" y="137" class="miss">✗ Allowed (same path)</text>
  <text x="604" y="137" class="miss">✗ Allowed in bridge test</text>
  <text x="798" y="137" class="warn">△ Caught post-write</text>
  <text x="982" y="137" class="pass">✓ Blocked pre-write</text>

  <!-- Row 2 -->
  <line x1="24" y1="210" x2="1136" y2="210" stroke="#e2e8f0"/>
  <text x="40"  y="180" class="td" font-weight="600">2. Append new test vs. weaken old test</text>
  <text x="40"  y="198" class="code">Allow new test(), block editing old expect()</text>
  <text x="416" y="189" class="miss">✗ All-or-nothing path</text>
  <text x="604" y="189" class="warn">△ Path read-only lock</text>
  <text x="798" y="189" class="warn">△ Path pre-write lock</text>
  <text x="982" y="189" class="pass">✓ Append-only AST</text>

  <!-- Row 3 -->
  <line x1="24" y1="262" x2="1136" y2="262" stroke="#e2e8f0"/>
  <text x="40"  y="232" class="td" font-weight="600">3. Partial JSON Schema / Doc drift</text>
  <text x="40"  y="250" class="code">Drop required key or flip &quot;5%&quot; -&gt; &quot;15%&quot;</text>
  <text x="416" y="241" class="miss">✗ Not inspected</text>
  <text x="604" y="241" class="miss">✗ Not inspected</text>
  <text x="798" y="241" class="miss">✗ Not built-in</text>
  <text x="982" y="241" class="pass">✓ Pointer &amp; token lock</text>

  <!-- Row 4 -->
  <line x1="24" y1="314" x2="1136" y2="314" stroke="#e2e8f0"/>
  <text x="40"  y="284" class="td" font-weight="600">4. Non-Git folder rogue shell delete</text>
  <text x="40"  y="302" class="code">Bash command deletes file outside Git repo</text>
  <text x="416" y="293" class="warn">△ Blocks 'pytest' too</text>
  <text x="604" y="293" class="miss">✗ Bash write allowed</text>
  <text x="798" y="293" class="warn">△ Policy evaluate only</text>
  <text x="982" y="293" class="pass">✓ SHA-256 restore</text>

  <!-- Row 5 -->
  <line x1="24" y1="366" x2="1136" y2="366" stroke="#e2e8f0"/>
  <text x="40"  y="336" class="td" font-weight="600">5. Zero-dependency install footprint</text>
  <text x="40"  y="354" class="code">Runtime packages &amp; warm hook latency</text>
  <text x="416" y="345" class="td">OS dependent</text>
  <text x="604" y="345" class="td">Node + jiti + yaml</text>
  <text x="798" y="345" class="td">Python + cryptography</text>
  <text x="982" y="345" class="pass">0 npm deps (~6 ms)</text>

  <!-- Row 6: Honest Boundary Highlight (wrapped cleanly inside Col 1 width <= 355px!) -->
  <rect x="24" y="376" width="1112" height="72" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40"  y="399" class="td" font-weight="700">6. Honest Boundary: Wrong math, same signature</text>
  <text x="40"  y="418" class="code">Keeps export calcTotal(x) intact, but changes</text>
  <text x="40"  y="435" class="code">body from 'return x * 2' to 'return 0'</text>
  <text x="416" y="416" class="warn">✗ Not caught</text>
  <text x="604" y="416" class="warn">✗ Not caught</text>
  <text x="798" y="416" class="warn">△ Needs witness cfg</text>
  <text x="982" y="408" class="warn">△ Needs unit test</text>
  <text x="982" y="426" class="code">or --acceptance Stop</text>

  <text x="28" y="474" class="note">Methodology note: Each tool was tested in an isolated temp workspace on identical synthetic edits, not as an overall product ranking.</text>
  <text x="28" y="492" class="note">NoStray pairs structural pre-write locks with '--acceptance' isolated test runs at Stop while preventing the agent from weakening those tests.</text>
</svg>
