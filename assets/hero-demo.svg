<svg xmlns="http://www.w3.org/2000/svg" width="980" height="524" viewBox="0 0 980 524" role="img" aria-label="NoStray live terminal demo showing allowed 2-line fix, blocked sibling export deletion, and byte-exact test file recovery">
  <style>
    .bg { fill: #0b0f17; }
    .chrome { fill: #111827; stroke: #1f2937; stroke-width: 1.2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .muted { fill: #64748b; }
    .dim { fill: #94a3b8; }
    .bright { fill: #f8fafc; }
    .green { fill: #10b981; font-weight: 600; }
    .rose { fill: #f43f5e; font-weight: 700; }
    .amber { fill: #f59e0b; font-weight: 600; }
    .sky { fill: #38bdf8; font-weight: 600; }
    .card { fill: #131b2e; stroke: #f43f5e; stroke-opacity: 0.45; stroke-width: 1.2; }
    .cursor { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <rect width="980" height="524" rx="14" class="bg"/>
  <rect x="1" y="1" width="978" height="522" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="1" y="1" width="978" height="40" rx="13" class="chrome"/>
  <rect x="1" y="26" width="978" height="15" fill="#111827"/>
  <line x1="1" y1="41" x2="979" y2="41" stroke="#1f2937" stroke-width="1"/>
  <circle cx="22" cy="21" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="42" cy="21" r="6" fill="#f59e0b" opacity="0.85"/>
  <circle cx="62" cy="21" r="6" fill="#10b981" opacity="0.85"/>
  <text x="490" y="25" text-anchor="middle" class="mono dim" font-size="12">nostray demo — isolated /tmp sandbox (Node.js &gt;= 22.13 · 0 npm deps · 0 LLM calls)</text>

  <!-- Step 1: Command & Task -->
  <g>
    <text x="28" y="72" class="mono"><tspan fill="#10b981">$</tspan> <tspan class="bright" font-weight="600">npx nostray demo</tspan> <tspan class="muted"># runs in disposable /tmp sandbox, never touches your repo</tspan></text>
    <text x="28" y="96" class="mono dim">Task prompt : <tspan class="bright">&quot;Fix 2-line cent rounding bug in calcTotal()&quot;</tspan></text>
    <text x="28" y="116" class="mono muted">Baseline    : src/checkout.mjs (exports: calcTotal, calcTax) · contracts/order.schema.json · test/checkout.test.mjs</text>
  </g>

  <!-- Step 2: Legitimate Surgical Edit -->
  <g>
    <rect x="28" y="132" width="924" height="46" rx="7" fill="#0d231d" stroke="#10b981" stroke-opacity="0.35"/>
    <text x="44" y="152" class="mono"><tspan class="green">✓ ALLOWED (5.8 ms)</tspan>  <tspan class="bright">Edit src/checkout.mjs</tspan> <tspan class="dim">— Math.round((subtotal + shipping) * 100) / 100</tspan></text>
    <text x="44" y="170" class="mono muted">Exports intact: calcTotal(2), calcTax(1) · Schema untouched · 'node --test' allowed cleanly</text>
  </g>

  <!-- Step 3: Blocked Stray Edit + Human Interception Card -->
  <g>
    <text x="28" y="204" class="mono"><tspan class="rose">✗ AGENT STRAY EDIT</tspan>  <tspan class="dim">Agent rewrites src/checkout.mjs and silently drops</tspan> <tspan class="bright">export function calcTax(amount)</tspan></text>
    <rect x="28" y="216" width="924" height="198" rx="9" class="card"/>
    <text x="46" y="242" class="mono"><tspan class="rose">✋ NoStray blocked a stray edit</tspan>  <tspan class="muted">[PUBLIC_EXPORT_MUTATED · 6.1 ms pre-write]</tspan></text>
    <line x1="46" y1="254" x2="934" y2="254" stroke="#1e293b" stroke-width="1"/>
    <text x="46" y="276" class="mono"><tspan class="dim">Your task   :</tspan> <tspan class="bright">Fix 2-line cent rounding bug in calcTotal()</tspan></text>
    <text x="46" y="297" class="mono"><tspan class="dim">AI tried to :</tspan> <tspan fill="#fda4af">Remove public export 'calcTax' from src/checkout.mjs (outside task scope)</tspan></text>
    <text x="46" y="318" class="mono"><tspan class="dim">Blast radius:</tspan> <tspan class="amber">3 downstream callers import 'calcTax' (invoice.mjs, cart.mjs, checkout.test.mjs)</tspan></text>
    <text x="46" y="346" class="mono dim">How to proceed:</text>
    <text x="60" y="366" class="mono"><tspan class="green">[1]</tspan> <tspan class="bright">Keep 'calcTax' intact and fix only 'calcTotal'</tspan> <tspan class="muted">(returned to agent automatically)</tspan></text>
    <text x="60" y="385" class="mono"><tspan class="sky">[2]</tspan> <tspan class="dim">Authorize change:</tspan> <tspan class="bright">nostray session start --prompt &quot;Allow updating src/checkout.mjs: remove calcTax&quot;</tspan></text>
    <text x="60" y="404" class="mono"><tspan class="sky">[3]</tspan> <tspan class="dim">Inspect full visual diff &amp; session timeline:</tspan> <tspan class="bright">nostray ui</tspan></text>
  </g>

  <!-- Step 4: Shell Rollback & Summary -->
  <g>
    <rect x="28" y="428" width="924" height="46" rx="7" fill="#0c1f33" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="44" y="448" class="mono"><tspan class="sky">↺ RECOVERED BYTE-FOR-BYTE</tspan>  <tspan class="bright">Rogue shell 'rm test/checkout.test.mjs'</tspan> <tspan class="dim">restored from local SHA-256 snapshot</tspan></text>
    <text x="44" y="465" class="mono muted">Dirty user edits preserved · Executable permissions preserved · Works in Git &amp; non-Git folders</text>
    <text x="28" y="500" class="mono"><tspan class="green">Summary:</tspan> <tspan class="bright">5 / 5 stray-edit scenarios contained · 0 false blocks on valid edits · Next: 'npx nostray ui'</tspan><tspan class="bright cursor"> ▋</tspan></text>
  </g>
</svg>
